    - heading "The three async patterns" [level=2] [ref=e152]
    - heading "Pattern A — await (blocking)" [level=3] [ref=e153]:
      - text: Pattern A —
      - code [ref=e154]: await
      - text: (blocking)
    - code [ref=e158]: "Aether: let resp = await http_get(url) Main thread: http_get(url) → IoPool.submit(HttpGet { url, tx }) → return Promise(IoWaiting(rx)) await Promise(IoWaiting(rx)) → rx.recv() ◄── BLOCKS until worker sends result Worker thread: → reqwest::blocking::get(url) → tx.send(IoResult::Str(Ok(body))) Main thread unblocks, gets result string"
    - paragraph [ref=e159]:
      - strong [ref=e160]: "EventLoopQueue: not used."
      - text: If called inside a TCP
      - code [ref=e161]: on_message
      - text: ", the dispatch loop is stalled for the duration of the HTTP request. Messages queue up in the TCP I/O thread’s read buffer and are processed one at a time."
    - separator [ref=e162]
    - heading "Pattern B — on_ready + event_loop() (non-blocking, standalone)" [level=3] [ref=e163]:
      - text: Pattern B —
      - code [ref=e164]: on_ready
      - text: +
      - code [ref=e165]: event_loop()
      - text: (non-blocking, standalone)
    - code [ref=e169]: "Aether: on_ready(http_get(url), fn(resp) { ... }) event_loop() Main thread: http_get(url) → Promise(IoWaiting(rx)) on_ready(promise, callback) → EventLoopQueue.push(rx, callback) ← returns immediately event_loop() loop { if queue.is_empty() → break ready = queue.drain_ready() ← non-blocking try_recv for (result, cb) in ready → call cb if nothing ready → sleep(1ms) }"
    - paragraph [ref=e170]:
      - strong [ref=e171]: "EventLoopQueue: used."
      - text: Multiple
      - code [ref=e172]: on_ready
      - text: calls can be registered before
      - code [ref=e173]: event_loop()
      - text: — all their HTTP requests run concurrently on IoPool workers.
    - separator [ref=e174]
    - heading "Pattern C — .then() inside TCP on_message (non-blocking, recommended)" [level=3] [ref=e175]:
      - text: Pattern C —
      - code [ref=e176]: .then()
      - text: inside TCP
      - code [ref=e177]: on_message
      - text: (non-blocking, recommended)
    - code [ref=e181]: "Aether: server.on_message(fn(conn, data) { http_get(url).then(fn(resp) { conn.write(resp) }) }) TCP dispatch loop: recv_timeout → Message 1 on_message(conn, data) http_get(url) → Promise(IoWaiting(rx)) .then(callback) → EventLoopQueue.push(rx, callback) ← returns immediately on_message returns tick_async_callbacks() ← fires callback when HTTP done recv_timeout → Message 2 ← processed immediately, not blocked on_message(conn, data) http_get(url).then(...) ← another queued, concurrent"
    - paragraph [ref=e182]:
      - strong [ref=e183]: "EventLoopQueue: used. TCP dispatch loop keeps running."
      - text: Both HTTP requests run concurrently on IoPool. Their callbacks fire via
      - code [ref=e184]: tick_async_callbacks()
      - text: as results arrive.
    - separator [ref=e185]
    - heading "Auto-drain at main() exit" [level=2] [ref=e186]:
      - text: Auto-drain at
      - code [ref=e187]: main()
      - text: exit
    - paragraph [ref=e188]:
      - text: After
      - code [ref=e189]: main()
      - text: returns,
      - code [ref=e190]: call_main()
      - text: (
      - code [ref=e191]: evaluator/mod.rs:957
      - text: ) checks whether the EventLoopQueue is non-empty and, if so, calls
      - code [ref=e192]: run_event_loop(None)
      - text: "automatically:"
    - code [ref=e196]: "// evaluator/mod.rs — call_main() result?; if !self.async_rt.event_loop_queue.is_empty() { self.run_event_loop(None)?; }"
    - paragraph [ref=e197]:
      - text: This is why
      - code [ref=e198]: .then()
      - text: callbacks fire without an explicit
      - code [ref=e199]: event_loop()
      - text: call in normal programs. It does not apply inside TCP/UDP servers — those have their own dispatch loop and never return from
      - code [ref=e200]: call_main
      - text: until the server is closed.
    - heading "Chained callbacks" [level=2] [ref=e201]
    - paragraph [ref=e202]:
      - text: A callback registered inside another callback (
      - code [ref=e203]: "sleep(0.1).then(fn { sleep(0.1).then(...) })"
      - text: ) works because
      - code [ref=e204]: run_event_loop
      - text: re-checks
      - code [ref=e205]: is_empty()
      - text: at the top of each iteration. When the inner
      - code [ref=e206]: .then()
      - text: pushes a new entry mid-loop, it is caught on the next tick — the loop only exits when the queue stays empty after a full drain.
