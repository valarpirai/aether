    - heading "Component 4 — Main thread dispatch loop" [level=2] [ref=e141]
    - paragraph [ref=e142]:
      - text: The main thread runs a tight loop after
      - code [ref=e143]: server.accept()
      - text: "is called:"
    - code [ref=e147]: "loop { // SIGINT handling (see TCP/UDP Internals doc) ... // Wait up to 10 ms for the next TCP event match event_rx.recv_timeout(Duration::from_millis(10)) { Ok(evt) => dispatch_tcp_server_event(evt), Err(RecvTimeoutError::Timeout) => {} // no event, loop again Err(RecvTimeoutError::Disconnected) => break // I/O thread exited } // Fire any .then() / on_ready() callbacks whose I/O is ready tick_async_callbacks() // calls EventLoopQueue::drain_ready() }"
    - paragraph [ref=e148]:
      - code [ref=e149]: tick_async_callbacks()
      - text: is what makes
      - code [ref=e150]: .then()
      - text: work inside TCP handlers — after each TCP event (or timeout), it drains the EventLoopQueue and fires any callbacks whose HTTP/file response has arrived.
