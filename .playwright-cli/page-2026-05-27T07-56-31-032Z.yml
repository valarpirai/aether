    - paragraph [ref=e89]:
      - text: Lives entirely on the main thread. A
      - code [ref=e90]: Vec
      - text: of pending entries — each pairing an I/O result receiver with an Aether callback.
    - code [ref=e94]: "struct EventLoopEntry { rx: Receiver<IoResult>, // result channel from IoPool worker callback: Value, // Aether fn to call when result arrives deadline: Option<Instant>, // optional per-task timeout }"
    - paragraph [ref=e95]:
      - strong [ref=e96]:
        - code [ref=e97]: drain_ready()
      - text: "— called on every tick, non-blocking:"
    - code [ref=e101]: "for each entry in pending: if deadline expired → fire callback with Err(\"task timed out\") elif try_recv() == Ok → fire callback with result else → keep in pending for next tick"
    - paragraph [ref=e102]:
      - code [ref=e103]: drain_ready
      - text: uses
      - code [ref=e104]: try_recv()
      - text: (never blocks). An entry stays in
      - code [ref=e105]: pending
      - text: until its worker sends a result or its deadline expires.
