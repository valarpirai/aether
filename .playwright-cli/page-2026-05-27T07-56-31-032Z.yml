    - code [ref=e117]: "TCP I/O thread Main thread ──────────────────────────────── ───────────────────────────── mio Poll (50 ms timeout): TCP dispatch loop (10 ms): new connection recv_timeout(10ms) → event_tx.send(Connected) ────────► dispatch_tcp_server_event() data received → call on_connect / on_message → event_tx.send(Message) ────────► / on_disconnect callbacks client disconnected → event_tx.send(Disconnected)────────► tick_async_callbacks() cmd_rx.try_recv(): ◄──────── cmd_tx.send(Write { data }) Write → stream.write_all ◄──────── cmd_tx.send(CloseConn) CloseConn → close stream ◄──────── cmd_tx.send(Shutdown) Shutdown → set shutdown flag"
