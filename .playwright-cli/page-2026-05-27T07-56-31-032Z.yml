    - heading "Async I/O Architecture" [level=1] [ref=e10]
    - paragraph [ref=e11]: "This document explains how async I/O works internally: the I/O thread pool, the event loop queue, the TCP/UDP I/O thread, and how the main interpreter thread coordinates all of them."
