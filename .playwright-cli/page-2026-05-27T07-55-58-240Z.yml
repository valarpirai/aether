    - heading "Quick Example" [level=2] [ref=e80]
    - code [ref=e82]: "fn main() { // Functional stdlib let numbers = range(1, 11) let total = sum(filter(map(numbers, fn(x) { return x * x }), fn(x) { return x % 2 == 0 })) println(\"sum of even squares:\", total) // 220 // Null safety: ?? and ?. let name = null println(name ?? \"anonymous\") // anonymous println(name?.upper() ?? \"UNKNOWN\") // UNKNOWN // Error handling with finally let f = null try { throw \"something went wrong\" } catch(e) { println(\"caught:\", e.message) } finally { println(\"cleanup always runs\") } // Multi-line string let query = \"\"\" SELECT * FROM users WHERE active = true \"\"\" println(query) }"
