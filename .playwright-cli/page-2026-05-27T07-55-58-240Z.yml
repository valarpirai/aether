    - heading "Aether Programming Language" [level=1] [ref=e8]
    - paragraph [ref=e9]: A general-purpose, dynamically typed programming language implemented in Rust — a fully-working tree-walking interpreter with async I/O, structs, iterators, and a self-hosted standard library.
    - heading "Features" [level=2] [ref=e10]
    - list [ref=e11]:
      - listitem [ref=e12]:
        - strong [ref=e13]: Dynamic Typing
        - text: — Runtime type checking with clear error messages
      - listitem [ref=e14]:
        - strong [ref=e15]: Automatic Memory Management
        - text: — Reference-counted garbage collection (no GC pauses)
